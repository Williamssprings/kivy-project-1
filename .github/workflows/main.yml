name: Build Kivy APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with buildozer
        uses: kivy/buildozer-action@v1
      - name: Download built APK
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: bin/*.apk
