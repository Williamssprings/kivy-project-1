name: Build Kivy APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer & dependencies
        run: |
          pip install buildozer
          sudo apt‑get update
          sudo apt‑get install‑y build‑essential git zip unzip openjdk‑17‑jdk‑headless libncurses5‑libncursesw6 libtool pkg‑config autoconf automake libffi‑dev libssl‑dev

      - name: Build APK
        run: buildozer‑android debug

      - name: Upload APK artifact
        uses: actions/upload‑artifact@v4
        with:
          name: output‑apk
          path: bin/*.apk
